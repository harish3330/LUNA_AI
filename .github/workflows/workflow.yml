name: LUNA Daily Weather Email

on:
  # ── Runs every day at 02:30 UTC = 08:00 IST ──────────────────────────────
  schedule:
    - cron: "30 2 * * *"

  # ── Allow a manual trigger from the GitHub Actions tab ───────────────────
  workflow_dispatch:

jobs:
  send-daily-email:
    name: Send LUNA Daily Weather Email
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Check out the repository ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Create .env from GitHub Secrets ────────────────────────────────
      - name: Create .env from secrets
        run: |
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
          echo "EMAIL_TO=${{ secrets.EMAIL_TO }}" >> .env
          echo "LUNA_CITY=Paris" >> .env
          echo "LUNA_COUNTRY=France" >> .env
          echo "LUNA_TIMEZONE=Europe/Paris" >> .env
          echo "LUNA_SEND_TIME=08:00" >> .env
          echo "LUNA_LATITUDE=48.8566" >> .env
          echo "LUNA_LONGITUDE=2.3522" >> .env

      # ── 5. Run LUNA ───────────────────────────────────────────────────────
      - name: Run LUNA — send today's weather email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LUNA_CITY: Paris
          LUNA_COUNTRY: France
          LUNA_TIMEZONE: Europe/Paris
          LUNA_SEND_TIME: "08:00"
          LUNA_LATITUDE: "48.8566"
          LUNA_LONGITUDE: "2.3522"
        run: python luna.py --run-now

      # ── 6. Clean up the .env file ─────────────────────────────────────────
      - name: Remove .env file
        if: always()
        run: rm -f .env
